[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "esm-msr"
version = "0.3.0"
description = "Epistasis-aware parameter-efficient fine-tuning and ESM3 model utilities."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    {name = "sareeves"}
]
# Core dependencies that don't vary by CUDA version
dependencies = [
    "biopython",
    "esm",
    "peft",
    "pandas<3.0.0",
    "numpy",
    "tqdm",
    "scipy>=1.13,<1.15",
    "httpx",
    "hf_xet",
    "pdbfixer"
]

[project.optional-dependencies]
# Optional: includes tools for training and analysis notebooks
dev = [
    "ipykernel",
    "matplotlib",
    "seaborn",
    "comet_ml",
    "pytorch-lightning>=2.0.0"
]

[tool.setuptools.package-dir]
"" = "src"
"msr_analysis" = "analysis/msr_analysis"

[tool.setuptools.packages.find]
where = ["src", "analysis"]
include = ["esm_msr*", "msr_analysis*"]

[tool.pytest.ini_options]
pythonpath = ["src", "analysis"]
testpaths = ["tests", "analysis/tests"]
